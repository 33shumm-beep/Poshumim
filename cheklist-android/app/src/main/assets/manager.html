<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Чек-лист замера · КапиталСтрой</title>
<style>:root{--bg:#f3f3f1;--card:#fff;--ink:#1d1f22;--mut:#6b6f76;--line:#e2e2de;--gr:#2b2e33;--red:#d32f2f;--red2:#fdeceb;--ok:#2e7d32;--ok2:#e8f5e9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.4 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--gr);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header img{height:40px}
header .t{flex:1;min-width:0}
header .t b{display:block;font-size:20px;letter-spacing:.3px}
header .t span{font-size:13px;opacity:.75}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 120px}
.btn{border:0;border-radius:12px;padding:14px 18px;font:inherit;font-weight:600;cursor:pointer;background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35);padding:10px 14px;font-size:15px}
input,textarea{width:100%;font:inherit;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--red)}
textarea{min-height:90px;resize:vertical}
label.f{display:block;font-size:14px;color:var(--mut);margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gr);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}

.bar{height:8px;background:rgba(255,255,255,.18);border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
.pc{font-size:22px;font-weight:700;min-width:64px;text-align:right}
.client{background:var(--card);border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.client .full{grid-column:1/-1}
@media(max-width:560px){.client{grid-template-columns:1fr}}
h2{display:flex;align-items:center;gap:10px;font-size:15px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:26px 4px 10px}
h2 .n{background:var(--gr);color:#fff;border-radius:8px;padding:2px 9px;font-size:14px}
h2 .c{margin-left:auto;font-size:14px;text-transform:none;letter-spacing:0}
h2.done .n{background:var(--ok)}
.it{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:2px solid transparent;border-radius:14px;padding:14px 16px;margin-bottom:8px;cursor:pointer;user-select:none;transition:background .15s,border-color .15s}
.it .box{flex:none;width:34px;height:34px;border-radius:9px;border:3px solid #c9c9c4;display:grid;place-items:center;margin-top:1px;transition:.15s}
.it .box svg{width:22px;height:22px;opacity:0}
.it b{display:block;font-size:19px}
.it small{display:block;color:var(--mut);font-size:15px;margin-top:3px}
.it.key{border-color:var(--red2)}
.it.key b:after{content:"важно";margin-left:8px;font-size:11px;vertical-align:middle;background:var(--red);color:#fff;border-radius:6px;padding:2px 6px;text-transform:uppercase;letter-spacing:.5px}
.it.on{background:var(--ok2)}
.it.on .box{background:var(--ok);border-color:var(--ok)}
.it.on .box svg{opacity:1}
.it.on b{color:#4a6b4c;text-decoration:line-through;text-decoration-color:rgba(46,125,50,.45)}
.say{background:#fff8e1;border-left:4px solid #f9a825;border-radius:10px;padding:10px 14px;margin:2px 0 10px;font-size:15px;color:#5d4a00}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.foot .btn{flex:1;min-width:200px}
.fin{display:none;background:var(--ok);color:#fff;border-radius:16px;padding:18px;text-align:center;font-size:20px;font-weight:700;margin-top:20px}
.fin.on{display:block}
</style></head><body>

  <div class="t"><b>Чек-лист замера</b><span id="sub">Отмечай по ходу, всё сохраняется само</span>
    <div class="bar"><i id="bar"></i></div></div>
  <div class="pc" id="pc">0%</div>
</header>
<div class="wrap">
  <div class="client">
    <div><label class="f">Клиент</label><input id="f_name" placeholder="Имя"></div>
    <div><label class="f">Адрес</label><input id="f_addr" placeholder="ЖК, дом, квартира"></div>
    <div class="full"><label class="f">Детали для «зацепки» и заметки</label><textarea id="f_note" placeholder="Например: переезжают с ребёнком, ремонт делали 2 раза, боятся сроков…"></textarea></div>
  </div>
  <div id="list"></div>
  <div class="client" style="margin-top:16px">
    <div><label class="f">Показ сметы: дата</label><input id="f_date" type="date"></div>
    <div><label class="f">Время</label><input id="f_time" type="time"></div>
  </div>
  <div class="fin" id="fin">Замер проведён на 100%. Красавчик! 🔥</div>
  <div class="foot">
    <button class="btn red" id="newBtn">Новый замер</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var DATA=[
 {t:"Встреча и дорога к квартире",i:[
  ["Неформальный заход","Поздравить с покупкой квартиры, зацепиться за деталь из первого контакта",1],
  ["Для кого квартира","Сами будете жить, дети, сдавать? Кто будет жить",0],
  ["Опыт ремонта","Сталкивались уже с ремонтом? Что понравилось, что нет",0]]},
 {t:"В квартире: старт",i:[
  ["Проговорить план встречи","Сначала замер, потом вопросы и разъяснения. В конце спросить: «Хорошо?»",1],
  ["Дать клиенту планшет","Визуализации + анкета клиента, пусть заполняет, пока меряем",1],
  ["Провести замер","Все помещения, окна и двери, стояки, фото каждой комнаты",0]]},
 {t:"Экспертность по ходу замера",i:[
  ["Радиаторы","Рассказать про вывод радиаторов из стены",0],
  ["Котёл","Рассказать про возможность переноса котла",0],
  ["Полотенцесушитель","Рассказать про замену полотенцесушителя",0]]},
 {t:"Вопросы после замера",i:[
  ["Сроки, отчётность, качество","«Насколько для вас важны сроки? Отчётность? Качество?»",1],
  ["Материалы и бюджет","Какие материалы нравятся, параллельно уточнить бюджет, чтобы в него уместиться",1],
  ["Кто закупает материалы","Сами ездить в рабочее время, выбирать, привозить, поднимать? Или доверить опытным людям?",1],
  ["Планировка и финальный вид","Есть понимание расстановки и итогового вида? (стиль клиент отметил в анкете)",0]]},
 {t:"Наши условия",i:[
  ["Проект и визуализация","Расстановку решим проектом, вид соберём на визуализации. Виза — в подарок к договору",1],
  ["Закупка материалов через нас","+20% к нашей закупке, но за счёт дилерских цен экономия и даже выгода около 8%. Все счета и чеки в чате",1],
  ["Старт и срок","Берём в работу сразу, срок чётко полгода. Срок и смета фиксируются в договоре",1],
  ["Пауза по желанию заказчика","Ремонт можно поставить на паузу под бюджет. История про мастера-одиночку: кончились деньги, ушёл, стены кривые, двойная оплата",0],
  ["Из чего состоит ремонт","Проект, виза, штукатурка, сантехника, электрика, шпаклёвка, полы, финишная отделка, двери, потолок, свет",0],
  ["Контроль этапов","Каждый этап ведёт РП, согласован заранее, закрывается актом. Проверка лично или онлайн",0],
  ["Без простоев","Мастеров много, простоя из-за «забухавшего мастера» не будет",0]]},
 {t:"Завершение",i:[
  ["Пройтись по анкете клиента","Забрать планшет, посмотреть ответы, уточнить непонятное",1],
  ["Назначить показ","Записать дату и время показа сметы, проекта и визы (поля внизу)",1],
  ["Анонс показа","На показе подробнее о работе на квартире, проект, виза и гарантия",0]]}
];
var KEY='ks_chek_menedzher_v1',st={};
try{st=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
var list=document.getElementById('list'),total=0,html='';
DATA.forEach(function(s,si){
  html+='<h2 id="h'+si+'"><span class="n">'+(si+1)+'</span>'+s.t+'<span class="c" id="c'+si+'"></span></h2>';
  s.i.forEach(function(it,ii){total++;var id=si+'_'+ii;
    html+='<div class="it'+(it[2]?' key':'')+'" data-id="'+id+'"><div class="box">'+CHECK+'</div><div><b>'+it[0]+'</b><small>'+it[1]+'</small></div></div>';});
});
list.innerHTML=html;
function render(){var done=0;
  DATA.forEach(function(s,si){var d=0;s.i.forEach(function(it,ii){if(st['c'+si+'_'+ii])d++});done+=d;
    document.getElementById('c'+si).textContent=d+' из '+s.i.length;
    document.getElementById('h'+si).classList.toggle('done',d==s.i.length);});
  document.querySelectorAll('.it').forEach(function(el){el.classList.toggle('on',!!st['c'+el.dataset.id])});
  var p=Math.round(done/total*100);
  document.getElementById('pc').textContent=p+'%';document.getElementById('bar').style.width=p+'%';
  document.getElementById('fin').classList.toggle('on',p==100);
}
list.addEventListener('click',function(e){var el=e.target.closest('.it');if(!el)return;
  var k='c'+el.dataset.id;st[k]=!st[k];if(!st[k])delete st[k];save();render();
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}});
['name','addr','note','date','time'].forEach(function(f){var el=document.getElementById('f_'+f);
  el.value=st['f_'+f]||'';el.addEventListener('input',function(){st['f_'+f]=el.value;save()});});
function toast(t){var x=document.getElementById('toast');x.textContent=t;x.classList.add('on');setTimeout(function(){x.classList.remove('on')},1800)}
document.getElementById('newBtn').onclick=function(){
  if(!confirm('Начать новый замер? Все галочки и поля очистятся.'))return;
  st={};save();['name','addr','note','date','time'].forEach(function(f){document.getElementById('f_'+f).value=''});
  render();window.scrollTo(0,0);toast('Чистый лист. Вперёд!');};
render();
</script>
</body></html>
