<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Квал. сделки месяца</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --text:#16181d; --muted:#6b7280; --line:#e3e5e9;
    --accent:#1f7a4d; --accent-text:#fff; --chip:#eef0f3; --bar:#2f6fde; --won:#1f7a4d; --lost:#b42318; --err:#b42318;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111317; --card:#1b1e24; --text:#eef0f3; --muted:#9aa1ac; --line:#2c3038;
      --accent:#2f9e66; --chip:#252932; --bar:#5b8def; --won:#3fb67a; --lost:#f97066; --err:#f97066; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  main{max-width:980px;margin:0 auto;padding:16px 16px 32px}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:12px}
  h1{font-size:22px;margin:0}
  .muted{color:var(--muted);font-size:13px}
  button{font:inherit;cursor:pointer}
  .refresh{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:6px 12px}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
  .kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chips button{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:999px;padding:5px 12px;font-size:14px}
  .chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
  .card h2{font-size:17px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
  .row{display:grid;grid-template-columns:minmax(120px,220px) 1fr 44px;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);cursor:pointer}
  .row:first-of-type{border-top:0}
  .row.empty{cursor:default;color:var(--muted)}
  .track{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
  .fill{height:100%;background:var(--bar);border-radius:6px}
  .fill.won{background:var(--won)} .fill.lost{background:var(--lost)}
  .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .list{margin:0 0 6px;padding:0;list-style:none}
  .list li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:6px 8px;border-radius:8px;background:var(--chip);margin-top:4px;font-size:14px}
  .list a{color:inherit;font-weight:500;text-decoration:none}
  .list a:hover{text-decoration:underline}
  .list .m{color:var(--muted);font-size:12px;grid-column:1/-1}
  .scroll{overflow-x:auto}
  .tab{width:100%;border-collapse:collapse;font-size:14px}
  .tab th{font-size:12px;color:var(--muted);font-weight:500;text-align:right;padding:6px 8px;white-space:nowrap}
  .tab th:first-child,.tab td:first-child{text-align:left}
  .tab td{padding:8px;border-top:1px solid var(--line)}
  .tab td .track{min-width:70px}
  .tab tr.itog td{font-weight:700}
  .kv{font-size:12px;color:var(--accent);font-weight:600}
  .err{color:var(--err);margin-top:16px}
  @media (max-width:520px){ .row{grid-template-columns:1fr 44px} .track{grid-column:1/-1;order:3} }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Сделки месяца</h1>
    <span class="muted" id="when">Загружаю…</span>
    <button class="refresh" id="refresh" type="button">Обновить</button>
  </header>
  <div class="kpi" id="kpi"></div>
  <div class="chips" id="pipes"></div>
  <div class="chips" id="people"></div>
  <div id="board"></div>
  <div class="err" id="err" hidden></div>
</main>
<script>
const URL_FN = "https://dfcylgccovrzrlgfpfpw.supabase.co/functions/v1/sdelki-mesyac";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmY3lsZ2Njb3ZyenJsZ2ZwZnB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MTczNDMsImV4cCI6MjEwNTk5MzM0M30.yiokXKJjJFH0c2nn8NKDyuTGfWbpyqUgo92K4TIHLPc";
const KEY = new URLSearchParams(location.hash.slice(1)).get("k") || "";
const REZHIM = ({ vchera: "vchera", konversii: "konversii", plan: "plan", prosrochka: "prosrochka" })[new URLSearchParams(location.search).get("p")] || "mesyac";
const MES = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rub = (n) => Math.round(n).toLocaleString("ru-RU") + " ₽";
const dt = (t) => new Date(t * 1000).toLocaleString("ru-RU", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit", timeZone:"Europe/Moscow"});
let data = null, pipe = "all", kto = "all", open = new Set();

function chips(el, items, cur, set) {
  el.innerHTML = items.map(([v, t]) => `<button type="button" data-v="${esc(v)}" aria-pressed="${String(v) === String(cur)}">${esc(t)}</button>`).join("");
  el.onclick = (e) => { const b = e.target.closest("button"); if (b) { set(b.dataset.v); render(); } };
}

function proc(a, b) { return b ? Math.round(a / b * 100) + "%" : "—"; }
function renderKonversii() {
  const mes = MES[new Date((data.s + 3 * 3600) * 1000).getUTCMonth()];
  $("title").textContent = "Конверсии за " + mes;
  $("when").textContent = "обновлено " + dt(data.obnovleno) + " · квал → замер → договор, по ответственному за сделку";
  const t = data.itogo;
  $("kpi").innerHTML = [
    ["Квал → замер", proc(t.zamer, t.kval) + ` <span class="muted">${t.zamer} из ${t.kval}</span>`],
    ["Замер → договор", proc(t.dogovor, t.zamer) + ` <span class="muted">${t.dogovor} из ${t.zamer}</span>`],
  ].map(([n, v]) => `<div><span class="muted">${n}</span><b>${v}</b></div>`).join("");
  $("pipes").innerHTML = ""; $("people").innerHTML = "";
  const bar = (a, b, cls) => `<div class="track"><div class="fill ${cls}" style="width:${b ? Math.min(100, a / b * 100) : 0}%"></div></div>`;
  const row = (x, bold) => `<tr${bold ? ' class="itog"' : ""}><td>${esc(x.imya)}</td>
      <td class="num">${x.kval}</td><td class="num">${x.zamer}</td><td>${bar(x.zamer, x.kval, "")}</td><td class="num">${proc(x.zamer, x.kval)}</td>
      <td class="num">${x.dogovor}</td><td>${bar(x.dogovor, x.zamer, "won")}</td><td class="num">${proc(x.dogovor, x.zamer)}</td></tr>`;
  $("board").innerHTML = `<section class="card"><div class="scroll"><table class="tab">
    <thead><tr><th>Менеджер</th><th>Квалы</th><th>Замеры</th><th></th><th>Квал→замер</th><th>Договоры</th><th></th><th>Замер→договор</th></tr></thead>
    <tbody>${data.menedzhery.map((x) => row(x)).join("")}${row(t, true)}</tbody></table></div>
    <p class="muted">Квалы: созданы в этом месяце в Основной и Отложенном спросе. Замер: сделка в этом месяце дошла до «Замер проведен» в Основной. Договор: в этом месяце перешла в «Договор подписан».</p></section>`;
}

function renderPlan() {
  const mes = MES[new Date((data.s + 3 * 3600) * 1000).getUTCMonth()];
  $("title").textContent = "Выполнение плана за " + mes;
  const dolya = data.den / data.dney;
  const ms = data.menedzhery;
  const plan = Math.round(ms.reduce((t, x) => t + x.plan, 0) / 1000) * 1000, fakt = ms.reduce((t, x) => t + x.fakt, 0);
  const pr = (a, b) => b ? Math.round(a / b * 100) : 0;
  const prognoz = (f) => dolya ? f / dolya : 0;
  const daty = ms.map((x) => x.na_datu).filter(Boolean).sort();
  const na = daty.length ? new Date(daty[daty.length - 1] + "T00:00:00Z").toLocaleDateString("ru-RU", {day: "numeric", month: "long", timeZone: "UTC"}) : "—";
  $("when").textContent = "обновлено " + dt(data.obnovleno) + " · сумма договоров из вечерних отчётов менеджеров (последний: " + na + ")";
  $("kpi").innerHTML = [
    ["Выполнено", pr(fakt, plan) + "%"],
    ["Факт", rub(fakt)],
    ["План отдела", rub(plan)],
    ["Осталось", rub(Math.max(0, plan - fakt))],
    ["Прошло месяца", Math.round(dolya * 100) + `% <span class="muted">${data.den} из ${data.dney} дн.</span>`],
    ["Прогноз к концу", pr(prognoz(fakt), plan) + "%"],
  ].map(([n, v]) => `<div><span class="muted">${n}</span><b>${v}</b></div>`).join("");
  $("pipes").innerHTML = ""; $("people").innerHTML = "";
  const stroka = (x, bold) => {
    const p = pr(x.fakt, x.plan), cls = p >= Math.round(dolya * 100) ? "won" : "lost";
    return `<tr${bold ? ' class="itog"' : ""}><td>${esc(x.imya)}</td><td class="num">${rub(x.fakt)}</td><td class="num">${rub(x.plan)}</td>
      <td><div class="track"><div class="fill ${cls}" style="width:${Math.min(100, p)}%"></div></div></td><td class="num">${p}%</td>
      <td class="num">${pr(prognoz(x.fakt), x.plan)}%</td></tr>`;
  };
  $("board").innerHTML = `<section class="card"><div class="scroll"><table class="tab">
    <thead><tr><th>Менеджер</th><th>Факт</th><th>План</th><th></th><th>Выполнено</th><th>Прогноз</th></tr></thead>
    <tbody>${ms.map((x) => stroka(x)).join("")}${stroka({ imya: "Весь отдел", fakt, plan }, true)}</tbody></table></div>
    <p class="muted">Зелёная полоса: идёт с опережением календаря, красная: отстаёт. Прогноз: если продавать в том же темпе до конца месяца.</p></section>`;
}

function skolko(sek) {
  const d = Math.floor(sek / 86400);
  if (d >= 1) return d + " дн.";
  const h = Math.floor(sek / 3600);
  return h >= 1 ? h + " ч" : Math.max(1, Math.floor(sek / 60)) + " мин";
}
const PRODAZHI = ["Максим Мещеряков", "Сергей Протасов", "Иван Васильев"]; // отдел продаж идёт первым
function renderProsrochka() {
  $("title").textContent = "Просроченные задачи";
  $("when").textContent = "обновлено " + dt(data.obnovleno) + " · невыполненные задачи со сроком в прошлом, по ответственному";
  if (kto === "all") kto = "prodazhi";
  const now = data.obnovleno, gr = {};
  for (const t of data.zadachi) (gr[t.kto] ??= []).push(t);
  const poryadok = (n) => PRODAZHI.includes(n) ? PRODAZHI.indexOf(n) : 100;
  const lyudi = Object.keys(gr).sort((a, b) => poryadok(a) - poryadok(b) || gr[b].length - gr[a].length);
  const vidno = lyudi.filter((n) => kto === "vse" || (kto === "prodazhi" ? PRODAZHI.includes(n) : n === kto));
  const z = vidno.flatMap((n) => gr[n]);
  $("kpi").innerHTML = [
    ["Просрочено", z.length],
    ["Больше 3 дней", z.filter((t) => now - t.srok >= 3 * 86400).length],
    ["Самая старая", z.length ? skolko(now - Math.min(...z.map((t) => t.srok))) : "—"],
  ].map(([n, v]) => `<div><span class="muted">${n}</span><b>${v}</b></div>`).join("");
  $("pipes").innerHTML = "";
  const vProd = PRODAZHI.reduce((t, n) => t + (gr[n]?.length ?? 0), 0);
  chips($("people"), [["prodazhi", "Отдел продаж · " + vProd], ["vse", "Все · " + data.zadachi.length], ...lyudi.map((n) => [n, n + " · " + gr[n].length])], kto, (v) => kto = v);
  const put = { leads: "leads/detail", contacts: "contacts/detail", companies: "companies/detail" };
  const max = Math.max(1, ...vidno.map((n) => gr[n].length));
  $("board").innerHTML = vidno.map((n) => {
    const list = gr[n], key = "z:" + n, isOpen = open.has(key) || kto === n;
    const star = list.filter((t) => now - t.srok >= 3 * 86400).length;
    return `<section class="card"><div class="row" data-k="${esc(key)}">
        <span>${isOpen ? "▾" : "▸"} ${esc(n)}${star ? ` <span class="muted">· ${star} больше 3 дн.</span>` : ""}</span>
        <div class="track"><div class="fill lost" style="width:${list.length / max * 100}%"></div></div>
        <span class="num">${list.length}</span></div>` +
      (isOpen ? `<ul class="list">${list.map((t) => {
        const url = put[t.tip] && t.eid ? `https://${data.domen}.amocrm.ru/${put[t.tip]}/${t.eid}` : "";
        const imya = esc(t.nazv || t.tekst || "Задача " + t.id);
        return `<li>${url ? `<a href="${url}" target="_blank" rel="noopener">${imya}</a>` : `<span>${imya}</span>`}
          <span class="num" style="color:var(--lost)">${skolko(now - t.srok)}</span>
          <span class="m">${t.nazv && t.tekst ? esc(t.tekst) + " · " : ""}срок был ${dt(t.srok)}</span></li>`;
      }).join("")}</ul>` : "") + `</section>`;
  }).join("") || `<p class="muted">Просроченных задач нет. Красота 👌</p>`;
}

function render() {
  if (data.rezhim === "prosrochka") return renderProsrochka();
  if (data.rezhim === "plan") return renderPlan();
  if (data.rezhim === "konversii") return renderKonversii();
  const d0 = new Date((data.s + 3 * 3600) * 1000);
  if (data.rezhim === "vchera") {
    $("title").textContent = "Новые сделки за " + d0.toLocaleDateString("ru-RU", {day: "numeric", month: "long", timeZone: "UTC"});
    $("when").textContent = "обновлено " + dt(data.obnovleno) + " · все созданные вчера, этап на сейчас · ✓ квал";
  } else {
    $("title").textContent = "Квал. сделки за " + MES[d0.getUTCMonth()];
    $("when").textContent = "обновлено " + dt(data.obnovleno) + " · квалифицированные, созданные с 1-го числа, этап на сейчас (включая закрытые)";
  }
  const vse = data.sdelki.filter((d) => kto === "all" || d.kto === kto);
  const vybor = vse.filter((d) => pipe === "all" || String(d.v) === pipe);
  const won = vybor.filter((d) => d.e === 142), lost = vybor.filter((d) => d.e === 143);
  $("kpi").innerHTML = [
    ["Всего сделок", vybor.length],
    ["В работе", vybor.length - won.length - lost.length],
    ["Успешно", won.length + (won.length ? " · " + rub(won.reduce((s, d) => s + d.price, 0)) : "")],
    ["Закрыто, не реализовано", lost.length],
    ...(data.rezhim === "vchera" ? [["Из них квал", vybor.filter((d) => d.kv).length]] : []),
  ].map(([t, v]) => `<div><span class="muted">${t}</span><b>${v}</b></div>`).join("");

  const est = data.voronki.filter((p) => vse.some((d) => d.v === p.id));
  chips($("pipes"), [["all", "Все воронки · " + vse.length], ...est.map((p) => [p.id, p.name + " · " + vse.filter((d) => d.v === p.id).length])], pipe, (v) => pipe = v);
  const lyudi = [...new Set(data.sdelki.map((d) => d.kto).filter(Boolean))].sort();
  chips($("people"), [["all", "Все менеджеры"], ...lyudi.map((n) => [n, n])], kto, (v) => kto = v);

  $("board").innerHTML = est.filter((p) => pipe === "all" || String(p.id) === pipe).map((p) => {
    const ds = vse.filter((d) => d.v === p.id);
    const max = Math.max(1, ...p.etapy.map((s) => ds.filter((d) => d.e === s.id).length));
    const rows = p.etapy.map((s) => {
      const list = ds.filter((d) => d.e === s.id);
      const key = p.id + ":" + s.id, isOpen = open.has(key) && list.length;
      const cls = s.id === 142 ? "won" : s.id === 143 ? "lost" : "";
      return `<div class="row${list.length ? "" : " empty"}" data-k="${key}">
          <span>${isOpen ? "▾" : list.length ? "▸" : "·"} ${esc(s.name)}</span>
          <div class="track"><div class="fill ${cls}" style="width:${list.length / max * 100}%"></div></div>
          <span class="num">${list.length}</span></div>` +
        (isOpen ? `<ul class="list">${list.map((d) => `<li><a href="https://${data.domen}.amocrm.ru/leads/detail/${d.id}" target="_blank" rel="noopener">${esc(d.name || "Сделка " + d.id)}</a>${data.rezhim === "vchera" && d.kv ? ' <span class="kv">✓ квал</span>' : ""}
          <span class="num">${d.price ? rub(d.price) : ""}</span>
          <span class="m">${esc(d.kto)} · создана ${dt(d.sozd)} · изменена ${dt(d.izm)}</span></li>`).join("")}</ul>` : "");
    }).join("");
    return `<section class="card"><h2><span>${esc(p.name)}</span><span class="num">${ds.length}</span></h2>${rows}</section>`;
  }).join("") || `<p class="muted">${data.rezhim === "vchera" ? "Вчера новых сделок не было." : "В этом месяце сделок нет."}</p>`;
}

$("board").onclick = (e) => {
  const r = e.target.closest(".row"); if (!r || r.classList.contains("empty")) return;
  open.has(r.dataset.k) ? open.delete(r.dataset.k) : open.add(r.dataset.k); render();
};

async function load() {
  $("refresh").disabled = true; $("when").textContent = "Загружаю…";
  try {
    const res = await fetch(URL_FN, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + ANON, apikey: ANON }, body: JSON.stringify({ k: KEY, p: REZHIM }) });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || "Ошибка " + res.status);
    data = j; $("err").hidden = true; render();
  } catch (e) {
    $("err").hidden = false; $("err").textContent = "Не загрузилось: " + e.message;
    if (data) render(); else $("when").textContent = "";
  } finally { $("refresh").disabled = false; }
}
$("refresh").onclick = load;
load();
setInterval(load, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && data && Date.now() / 1000 - data.obnovleno > 60) load(); });
</script>
</body>
</html>
