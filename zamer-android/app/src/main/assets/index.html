/* Фирменный стиль КапиталСтрой: графит + сигнальный красный, чертёжная сетка.
   Раскладка: тёмная шапка с логотипом → липкая лента вкладок → карточки на светлом «бетонном» фоне. */
:root{
 --graphite:#1E2227;--graphite2:#2B3037;--graphite3:#3A414A;
 --red:#D3232B;--red2:#B01B22;--redsoft:#FCE9EA;
 --bg:#EEF0F2;--card:#FFFFFF;--ink:#1E2227;--mut:#69717C;--line:#DDE1E6;--line2:#EEF1F4;
 --acc:var(--red);--acc2:var(--graphite);--ok:#1E8A4C;--oksoft:#E5F4EA;--warn:#C2410C;--warnsoft:#FFF1E8;
 --blue:#2F6FDB;
 --display:'Oswald','Arial Narrow','Roboto Condensed',sans-serif;
 --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 --r:16px;--hh:64px;
 color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font:16px/1.45 var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--graphite)}
::selection{background:var(--red);color:#fff}
:focus-visible{outline:3px solid color-mix(in srgb,var(--red) 55%,transparent);outline-offset:2px}

/* шапка */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--hh);background:var(--graphite);color:#fff;display:flex;align-items:center;gap:14px;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
 background-image:linear-gradient(90deg,transparent 0 calc(100% - 1px),#ffffff08 0),linear-gradient(0deg,transparent 0 calc(100% - 1px),#ffffff08 0);background-size:24px 24px}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--red) 0 120px,transparent 120px)}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;flex:none}
.brand .mk{height:40px;width:auto;flex:none}
.brand .wm{font:700 21px/1 var(--body);letter-spacing:-.01em;white-space:nowrap}
.brand .wm b{color:inherit;font-weight:700}
.brand .sub{display:block;font:500 12px/1 var(--body);letter-spacing:.02em;color:#ffffffa6;margin-top:4px}
header h1{font:600 18px/1.1 var(--body);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:14px;border-left:1px solid #ffffff26}
header h1:empty{border:0}
header button{display:inline-flex;align-items:center;gap:6px;background:#ffffff10;color:#fff;border:1px solid #ffffff2e;border-radius:12px;min-height:42px;padding:0 14px;font:600 15px var(--body);cursor:pointer}
header button:active{background:#ffffff22}
header #hdrAction{background:transparent}
@media (max-width:640px){.brand .wm,.brand .sub{display:none}}

main{max-width:1240px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* типографика */
h2{font:600 17px/1.2 var(--display);letter-spacing:.07em;text-transform:uppercase;margin:0 0 14px;display:flex;align-items:center;gap:10px;text-wrap:balance}
h2::before{content:"";width:14px;height:10px;flex:none;border-left:2px solid var(--red);border-right:2px solid var(--red);background:linear-gradient(var(--red),var(--red)) center/100% 2px no-repeat}
h2 small{font-family:var(--body);text-transform:none;letter-spacing:0}
h3{font:700 12px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;margin:18px 0 10px;color:var(--mut)}
label{display:block;font:600 12px/1.2 var(--body);letter-spacing:.04em;color:var(--mut);margin:10px 0 6px}
small{font-size:.82em}

/* поверхности */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:14px}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* поля */
input,select,textarea{width:100%;font:500 17px var(--body);min-height:50px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--graphite);box-shadow:0 0 0 4px #1e22271a}
input[type=number]{font-variant-numeric:tabular-nums}
input::placeholder,textarea::placeholder{color:#9AA1AB}
textarea{min-height:92px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;min-height:50px;padding:0 20px;font:700 16px var(--body);background:var(--red);color:#fff;cursor:pointer;transition:transform .08s,background .15s;box-shadow:0 1px 0 #00000014,0 6px 16px -8px color-mix(in srgb,var(--red) 70%,transparent)}
.btn:active{transform:scale(.97)}
.btn:hover{background:var(--red2)}
.btn.sec{background:var(--line2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.sec:hover{background:#E4E8EC}
.btn.blue{background:var(--graphite);box-shadow:0 6px 16px -8px #1e2227aa}
.btn.blue:hover{background:var(--graphite3)}
.btn.sm{min-height:42px;padding:0 14px;font-size:14px;border-radius:11px}
.btn.ghost{background:transparent;color:var(--red);box-shadow:none;padding:0 8px}
.btn:disabled{opacity:.4;pointer-events:none}
.btn svg,.chip svg{width:19px;height:19px;flex:none}
.x{border:0;background:var(--redsoft);color:var(--red2);border-radius:10px;min-height:50px;font-size:20px;cursor:pointer}

/* чипы */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:46px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:0 15px;font:600 15px var(--body);color:var(--ink);cursor:pointer;user-select:none;transition:background .12s,border-color .12s,transform .08s}
.chip:active{transform:scale(.96)}
.chip:hover{border-color:#C5CBD3}
.chip.on{background:var(--graphite);color:#fff;border-color:var(--graphite)}
.chip.on::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--red);flex:none}
.chip.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.chip.sm.on::before{width:6px;height:6px}
.subv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0 6px;padding:2px 0 2px 14px;border-left:2px dashed #C9CFD6}
.subv>small{font:700 12px var(--body);color:var(--mut);letter-spacing:.03em}

/* вкладки */
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));z-index:15;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:-16px calc(-1*max(16px,env(safe-area-inset-left,0px))) 16px;padding:10px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs .chip{flex:none;background:transparent;border-color:transparent;min-height:46px;font-weight:700;color:var(--graphite3);position:relative}
.tabs .chip:hover{background:#fff;border-color:var(--line)}
.tabs .chip.on{background:var(--graphite);color:#fff}
.tabs .chip.on::before{display:none}
.tabs .dot{width:8px;height:8px;border-radius:50%;background:#C5CBD3;flex:none}
.tabs .dot.ok{background:var(--ok)}
.tabs .dot.part{background:#E5A23A}

/* список и элементы */
.list .item{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:#fff;cursor:pointer;transition:border-color .15s,transform .08s}
.list .item:hover{border-color:#BFC6CF}
.list .item:active{transform:scale(.99)}
.list .item .t{flex:1;min-width:0}
.list .item small{color:var(--mut);display:block;margin-top:2px}

/* старт */
.hero{position:relative;overflow:hidden;background:var(--graphite);color:#fff;border-radius:20px;padding:26px 26px 22px;margin-bottom:16px;
 background-image:linear-gradient(90deg,transparent 0 calc(100% - 1px),#ffffff0d 0),linear-gradient(0deg,transparent 0 calc(100% - 1px),#ffffff0d 0);background-size:32px 32px}
.hero::after{content:"";position:absolute;right:26px;bottom:24px;width:180px;height:14px;border-left:2px solid #D3232B;border-right:2px solid #D3232B;background:linear-gradient(#D3232B,#D3232B) center/100% 2px no-repeat;opacity:.9}
@media (max-width:700px){.hero::after{display:none}}
.hero .eyebrow{font:600 12px var(--body);letter-spacing:.2em;text-transform:uppercase;color:#ffffff8c}
.hero h1{font:600 clamp(28px,4vw,40px)/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:8px 0 18px;text-wrap:balance}
.hero h1 b{color:var(--red);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px;max-width:620px}
.kpi{background:#ffffff0d;border:1px solid #ffffff1c;border-radius:14px;padding:12px 14px}
.kpi b{display:block;font:500 30px/1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:#ffffffa6}
.hero .btn{min-height:56px;font-size:17px;padding:0 26px}
.objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:14px}
.obj{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;transition:border-color .15s,transform .08s,box-shadow .15s}
.obj:hover{border-color:#BFC6CF;box-shadow:0 10px 24px -18px #1e222780}
.obj:active{transform:scale(.99)}
.obj .th{background:#F6F8FA;border-radius:12px;border:1px solid var(--line2);height:110px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#AAB1BA;font-size:12px}
.obj .th svg{width:100%;height:100%;border:0;background:transparent}
.obj .nm{font:700 17px/1.2 var(--body);margin:2px 0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obj .ad{color:var(--mut);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obj .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:5px;font:700 12px/1 var(--body);padding:6px 9px;border-radius:8px;background:var(--line2);color:var(--graphite3);font-variant-numeric:tabular-nums}
.tag.ok{background:var(--oksoft);color:var(--ok)}
.tag.warn{background:var(--warnsoft);color:var(--warn)}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}

/* план */
.plan{width:100%;height:420px;background:#FAFBFC;border:1px solid var(--line);border-radius:14px}
#planBox .plan,#aptBox .plan{height:min(62vh,580px);background-color:#F8FAFC;background-image:linear-gradient(#E9EDF2 1px,transparent 1px),linear-gradient(90deg,#E9EDF2 1px,transparent 1px);background-size:20px 20px}
.xplan .plan{height:300px}

/* цифры */
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat div{background:var(--line2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat b{display:block;font:500 26px/1.05 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.stat span{font-size:12px;font-weight:600;color:var(--mut)}
.warn{color:var(--warn);font-weight:700}
.okc{color:var(--ok);font-weight:700}

/* таблицы */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);background:var(--line2)}
th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child>th{font:700 14px var(--body);color:var(--ink);letter-spacing:0;text-transform:none;background:var(--line2)}
tr:first-child>th{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
table.calc td:first-child{font-weight:700;white-space:nowrap}
table.calc td:nth-child(2){color:var(--mut);font-size:13px}

/* редактор помещения */
.wall{display:grid;grid-template-columns:48px 1fr 1fr 50px;gap:8px;align-items:center;margin-bottom:8px}
.wall b{font:500 18px var(--display);text-align:center;background:var(--graphite);color:#fff;border-radius:10px;min-height:50px;display:flex;align-items:center;justify-content:center}
.ft{display:grid;grid-template-columns:1.3fr .7fr 1fr 1fr 1fr 1fr 50px;gap:6px;align-items:center;margin-bottom:8px}
.dv{display:grid;grid-template-columns:.7fr 1.4fr 1fr 50px;gap:6px;align-items:center;margin-bottom:8px}
.op{display:grid;grid-template-columns:1.25fr .75fr .8fr .8fr .8fr 1.4fr 50px;gap:6px;align-items:center;margin-bottom:8px}
.op input,.op select,.ft input,.ft select,.dv input,.dv select{padding:10px 8px;font-size:15px}
@media (max-width:700px){.op,.ft{grid-template-columns:repeat(3,minmax(0,1fr))}.op>span:empty,.ft>span:empty{display:none}}
#tools{gap:8px}
#tools .chip{min-height:48px}

/* отделка */
.fin{transition:border-color .15s}
.fin.open{border-color:var(--graphite)}
.finhead{cursor:pointer}
.finhead h2{margin:0 0 6px}
.finsum{font-size:14px;line-height:1.6}
.cnt .btn{width:56px;font-size:24px;padding:0}
.cnt b{font:500 30px var(--display);min-width:48px;text-align:center}
.xw{display:grid;grid-template-columns:minmax(220px,340px) minmax(0,1fr);gap:12px;margin-top:10px;align-items:start}
@media (max-width:820px){.xw{grid-template-columns:minmax(0,1fr)}}
.xbox{border:2px solid;border-radius:14px;padding:12px 14px;margin-bottom:10px}

/* фото */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;height:120px;object-fit:cover;border-radius:12px;display:block}
.photos figcaption{font-size:12px;color:var(--mut);margin-top:4px}
.photos .x{position:absolute;top:6px;right:6px;min-height:34px;width:34px;padding:0}

/* модальные окна и уведомления */
.modal{position:fixed;inset:0;background:#14171bb3;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fade .15s}
.modal .box{background:#fff;border-radius:20px;padding:22px;width:min(460px,100%);box-shadow:0 30px 60px -20px #0008;animation:pop .18s}
.modal input{font:500 34px var(--display);text-align:center;min-height:70px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--graphite);color:#fff;font:700 14px var(--body);padding:12px 18px;border-radius:12px;display:flex;gap:8px;align-items:center;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 12px 30px -12px #000a}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{width:8px;height:8px;border-radius:2px;background:var(--red)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
@keyframes rise{from{transform:translateY(8px);opacity:.4}}
#tab>.card,.objs>.obj{animation:rise .25s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hidden{display:none!important}
#passport{display:none}
@page{margin:12mm}
@media print{
  header,main,.tabs,.toast,body::before{display:none!important}
  #passport{display:block;padding:0;font-size:12px;font-family:var(--body)}
  #passport .pg{page-break-inside:avoid;margin-bottom:14px}
  #passport svg{height:300px}
  #passport h2::before{display:none}
  body{background:#fff}
}
</style>

<script>
// ---------- хранилище (IndexedDB, работает без интернета) ----------
const DB = {
  db: null,
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open('zamer-ks',1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore('objects',{keyPath:'id'}); r.result.createObjectStore('photos',{keyPath:'id'}); };
    r.onsuccess=()=>{DB.db=r.result;res()}; r.onerror=()=>rej(r.error); }); },
  tx(s,m){ return DB.db.transaction(s,m).objectStore(s); },
  all(s){ return new Promise(res=>{ const q=DB.tx(s,'readonly').getAll(); q.onsuccess=()=>res(q.result||[]); }); },
  get(s,id){ return new Promise(res=>{ const q=DB.tx(s,'readonly').get(id); q.onsuccess=()=>res(q.result); }); },
  put(s,v){ return new Promise(res=>{ const q=DB.tx(s,'readwrite').put(v); q.onsuccess=()=>res(); }); },
  del(s,id){ return new Promise(res=>{ const q=DB.tx(s,'readwrite').delete(id); q.onsuccess=()=>res(); }); }
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $=s=>document.querySelector(s);
const ICO={
 hand:'<path d="M8 13V5.5a1.5 1.5 0 013 0V12m0-1V4.5a1.5 1.5 0 013 0V12m0-6.5a1.5 1.5 0 013 0V13m0-4.5a1.5 1.5 0 013 0V15a7 7 0 01-7 7h-1a7 7 0 01-6-3.5L3.5 14a1.6 1.6 0 012.7-1.7L8 15"/>',
 ruler:'<path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/>',
 diag:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 21L21 3"/>',
 photo:'<path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/>',
 pen:'<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/>',
 undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 rect:'<rect x="3" y="6" width="18" height="12" rx="1"/>',
 link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',
 rotate:'<path d="M20 12a8 8 0 11-2.3-5.7"/><path d="M20 4v5h-5"/>',
 mirror:'<path d="M12 3v18"/><path d="M8 7L3 12l5 5zM16 7l5 5-5 5z"/>',
 drop:'<path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/>',
 doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>',
 down:'<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',
 rooms:'<path d="M3 4h18v16H3zM12 4v9M12 17v3M3 12h5"/>',
 plan:'<path d="M3 3h11v8h7v10H3z"/><path d="M14 11v4M8 3v6"/>',

 roller:'<rect x="3" y="3" width="15" height="6" rx="1.5"/><path d="M18 6h3v6h-9v3"/><rect x="10" y="15" width="4" height="7" rx="1"/>',
 sum:'<path d="M18 4H6l7 8-7 8h12"/>'
};
const ic=(n,sz=20)=>`<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[n]||''}</svg>`;
let toastT=null; function toast(t='Сохранено'){ const el=$('#toast'); if(!el) return; $('#toastT').textContent=t; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1400); }
function confirmBox(text,ok='Да'){ return new Promise(res=>{ const d=document.createElement('div'); d.className='modal';
  d.innerHTML=`<div class="box"><h2>Подтвердите</h2><p style="margin:0 0 16px;font-size:17px">${text}</p><div class="row"><button class="btn" id="cok" style="flex:1">${ok}</button><button class="btn sec" id="cno" style="flex:1">Отмена</button></div></div>`;
  document.body.appendChild(d); const end=v=>{d.remove();res(v);}; d.querySelector('#cok').onclick=()=>end(true); d.querySelector('#cno').onclick=()=>end(false); d.onclick=e=>{if(e.target===d)end(false);}; }); }
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const f2=n=>(Math.round(n*100)/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});

// ---------- справочники ----------
const ROOM_TYPES=['Комната','Спальня','Гостиная','Детская','Кухня','Кухня-гостиная','Санузел','Ванная','Туалет','Коридор','Прихожая','Гардероб','Балкон/лоджия'];
const FLAT_ROOMS={ // что ставится автоматически при выборе типа
  'Однокомнатная':['Комната','Кухня','Санузел','Коридор'],
  'Двухкомнатная':['Комната 1','Комната 2','Кухня','Санузел','Коридор'],
  'Трёхкомнатная':['Комната 1','Комната 2','Комната 3','Кухня','Санузел','Коридор'],
  'Четырёхкомнатная':['Комната 1','Комната 2','Комната 3','Комната 4','Кухня','Санузел','Коридор'],
  'Частный дом':['Гостиная','Спальня','Кухня','Санузел','Прихожая']};
function newRoom(o,type,name){ return {id:uid(),type,name,height:o.rooms[0]?.height||'270',walls:[],openings:[],state:{},note:''}; }

// ---------- расчёты: всё видно, чтобы менеджер мог сверить ----------
const m2=v=>f2(v), mm=v=>(Math.round(v)||0).toLocaleString('ru-RU');
function calcHTML(room){
  const g=geom(room), b=baseGeom(room), H=num(room.height)/100; const rows=[];
  const line=(t,f,r)=>rows.push(`<tr><td>${t}</td><td>${f}</td><td class="n"><b>${r}</b></td></tr>`);
  // периметр
  const parts=g.segs.filter(s=>s.len).map(s=>mm(s.len));
  line('Периметр стен',parts.join(' + ')+' см',f2(g.perim)+' м');
  // площадь
  const rect=room.walls.length===4&&!g.diag&&room.walls.every(w=>Math.abs(num(w.turn??90))===90)&&num(room.walls[0].len)===num(room.walls[2].len)&&num(room.walls[1].len)===num(room.walls[3].len);
  const bA=b.closed?Math.abs(b.poly.reduce((s,p,i,a)=>{const q=a[(i+1)%a.length];return s+p[0]*q[1]-q[0]*p[1];},0))/2/10000:0;
  if(rect) line('Пол: основа',`${f2(num(room.walls[0].len)/100)} × ${f2(num(room.walls[1].len)/100)}`,m2(bA)+' м²');
  else line('Пол: основа',`по координатам углов ${baseCorners(room).map((p,i)=>`${LET[i]}(${mm(p[0])}; ${mm(p[1])})`).join(', ')} — формула площади многоугольника`,b.closed?m2(bA)+' м²':'контур не замкнут');
  let A=bA;
  (room.features||[]).forEach(f=>{ const w=num(f.w)/100,d=num(f.d)/100; if(!w||!d) return; const v=w*d;
    if(f.type==='Выступ'){A-=v;line('− выступ',`${f2(w)} × ${f2(d)}`,'−'+m2(v)+' м²');}
    if(f.type==='Ниша'){A+=v;line('+ ниша',`${f2(w)} × ${f2(d)}`,'+'+m2(v)+' м²');}
    if(f.type==='Колонна'){A-=v;line('− колонна',`${f2(w)} × ${f2(d)}`,'−'+m2(v)+' м²');} });
  line('<b>Пол = потолок</b>','',m2(g.area)+' м²');
  // диагонали и углы
  const bc=baseCorners(room);
  if(b.closed&&bc.length>=4){ const ds=[]; for(let i=0;i<bc.length;i++) for(let j=i+2;j<bc.length;j++){ if(i===0&&j===bc.length-1) continue; ds.push([i,j]); }
    ds.forEach(([i,j])=>{ const v=Math.hypot(bc[j][0]-bc[i][0],bc[j][1]-bc[i][1]); line(`Диагональ ${LET[i]}–${LET[j]}`,'по плану',mm(v)+' см'); });
    if(g.diag) line('Диагональ А–В (замер)','введена менеджером',mm(num(room.diag))+' см');
    else if(bc.length===4){ const d1=Math.hypot(bc[2][0]-bc[0][0],bc[2][1]-bc[0][1]),d2=Math.hypot(bc[3][0]-bc[1][0],bc[3][1]-bc[1][1]); if(Math.abs(d1-d2)<1) rows.push(`<tr><td colspan="3" style="color:var(--mut)">Если на объекте диагонали А–В и Б–Г отличаются больше чем на 1–2 см, углы не 90°: введите замеренную диагональ в карточке комнаты.</td></tr>`); }
    line('Углы',b.angles.slice(0,bc.length).map((a,i)=>`${LET[(i+1)%bc.length]}: ${a.toFixed(1).replace('.',',')}°`).join(', '),''); }
  // стены
  let W=g.perim*H; line('Стены: периметр × высота',`${f2(g.perim)} × ${f2(H)}`,m2(W)+' м²');
  (room.openings||[]).forEach(o=>{ const w=num(o.w)/100,h=num(o.h)/100; line(`− ${o.type.toLowerCase()} (стена ${o.wall})`,`${f2(w)} × ${f2(h)}`,'−'+m2(w*h)+' м²'); });
  (room.features||[]).filter(f=>f.type==='Колонна').forEach(f=>{ const p=2*(num(f.w)+num(f.d))/100; line('+ колонна (обшивка)',`${f2(p)} × ${f2(H)}`,'+'+m2(p*H)+' м²'); });
  line('<b>Стены без проёмов</b>','',m2(g.walls)+' м²');
  // откосы, плинтус
  const win=(room.openings||[]).filter(o=>o.type==='Окно'||o.type==='Балконный блок');
  if(win.length) line('Откосы',win.map(o=>`${f2(num(o.w)/100)} + 2 × ${f2(num(o.h)/100)}`).join(' + '),f2(g.slopes)+' м');
  const doors=(room.openings||[]).filter(o=>o.type!=='Окно');
  line('Плинтус',`${f2(g.perim)}${g.cols.length?' + колонны':''}${doors.length?' − двери '+doors.map(o=>f2(num(o.w)/100)).join(' − '):''}`,f2(g.plinth)+' м');
  // свои размеры
  (room.dims||[]).forEach(d=>{ const v=Math.hypot(d.b[0]-d.a[0],d.b[1]-d.a[1]); const df=num(d.val)-v; line('Размер (замер)',`по плану ${mm(v)} см${Math.abs(df)>=2?` <span class="warn">расходится на ${mm(df)} см</span>`:''}`,esc(d.val)+' см'); });
  if(room.walls.length>2&&g.closed&&g.gap>=1) rows.push(`<tr><td colspan="3" style="color:var(--mut)">Невязка контура ${mm(g.gap)} см (стены не идеально параллельны) — в пределах допуска.</td></tr>`);
  if(room.walls.length>2&&!g.closed&&!g.diag) rows.push(`<tr><td colspan="3" class="warn">Контур не сходится на ${mm(g.gap)} см: площадь неточная, проверьте стены.</td></tr>`);
  return `<table class="calc">${rows.join('')}</table>`;
}

// ---------- рисование пальцем ----------
function rdp(pts,eps){ if(pts.length<3) return pts; const [a,b]=[pts[0],pts[pts.length-1]]; let md=0,mi=0; const L=Math.hypot(b[0]-a[0],b[1]-a[1])||1;
  for(let i=1;i<pts.length-1;i++){ const d=Math.abs((b[0]-a[0])*(a[1]-pts[i][1])-(a[0]-pts[i][0])*(b[1]-a[1]))/L; if(d>md){md=d;mi=i;} }
  return md>eps?rdp(pts.slice(0,mi+1),eps).slice(0,-1).concat(rdp(pts.slice(mi),eps)):[a,b]; }
function snapNext(prev,p){ const dx=p[0]-prev[0],dy=p[1]-prev[1]; let L=Math.round(Math.hypot(dx,dy)/10)*10; if(L<20) return null;
  const ang=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4); return [prev[0]+Math.round(Math.cos(ang)*L),prev[1]+Math.round(Math.sin(ang)*L)]; }
function cornersToWalls(C){ const n=C.length, hs=C.map((p,i)=>{const q=C[(i+1)%n];return Math.atan2(q[1]-p[1],q[0]-p[0])*180/Math.PI;});
  return C.map((p,i)=>{ const q=C[(i+1)%n]; let t=hs[(i+1)%n]-hs[i]; t=((t%360)+540)%360-180; return {len:String(Math.round(Math.hypot(q[0]-p[0],q[1]-p[1]))),turn:Math.round(t),est:true}; }); }

// ---------- общий план квартиры ----------
function placed(room,pr){ // перевод локальных координат комнаты в координаты квартиры
  const p=room.pos||{x:0,y:0,rot:0}, r=(p.rot||0)*Math.PI/180, c=Math.cos(r), s=Math.sin(r);
  return q=>[p.x+q[0]*c-q[1]*s, p.y+q[0]*s+q[1]*c];
}
function aptBounds(o){ let xs=[],ys=[]; o.rooms.forEach(r=>{const pr=roomPrims(r),M=placed(r,pr); pr.g.pts.forEach(q=>{const t=M(q);xs.push(t[0]);ys.push(t[1]);});}); if(!xs.length) return [0,0,100,100]; return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]; }
function ensurePos(o){ let x=0; o.rooms.forEach(r=>{ if(!r.pos){ const g=geom(r); const xs=g.pts.map(p=>p[0]),ys=g.pts.map(p=>p[1]); r.pos={x:x-Math.min(...xs),y:-Math.min(...ys),rot:0}; x+=Math.max(...xs)-Math.min(...xs)+120; } }); }
function aptSVG(o,opts={}){
  ensurePos(o); const [x0,y0,x1,y1]=opts.vb||aptBounds(o), m=120; const vb=[x0-m,y0-m,(x1-x0)+2*m,(y1-y0)+2*m];
  const sc=1; let s=`<svg class="plan" id="apt" viewBox="${vb.join(' ')}" xmlns="http://www.w3.org/2000/svg" font-family="Manrope,system-ui,sans-serif" style="height:${opts.thumb?'100%':(opts.h||560)+'px'};touch-action:none">`;
  o.rooms.forEach((r,i)=>{ const pr=roomPrims(r), M=placed(r,pr);
    s+=`<g data-room="${r.id}" style="cursor:move">${primsSVG(r,pr,M,sc,{thin:true})}`;
    if(pr.c&&!opts.thumb){ const c=M(pr.c),fs=Math.max(18,Math.min(34,Math.sqrt(pr.g.area)*9)); s+=`<text x="${c[0]}" y="${c[1]-fs*0.2}" font-size="${fs}" font-weight="700" text-anchor="middle" fill="#1f2937">${i+1}. ${esc(r.name)}</text><text x="${c[0]}" y="${c[1]+fs}" font-size="${fs*0.85}" text-anchor="middle" fill="#1f2937">${f2(pr.g.area)} м²</text>`; }
    if(opts.sel===r.id) s+=`<polygon points="${pr.g.poly.map(q=>M(q).join(',')).join(' ')}" fill="none" stroke="#D3232B" stroke-width="6" stroke-dasharray="14 8"/>`;
    s+='</g>'; });
  return s+'</svg>';
}

  // ---------- интерактивный план: просмотр / рисование / свой размер / план клиента ----------

    scale:'Масштаб фото: нажмите две точки на фото, между которыми известен размер (например, подписанная стена), и введите его в см.'};
  const box=$('#planBox');
  const bgVB=()=>{ const b=r.bg; return b?[b.x-100,b.y-100,b.w+200,b.h+200]:null; };
  const renderPlan=()=>{

    $('#diagT').classList.toggle('on',!!ed.diags); $('#drawBar').classList.toggle('hidden',ed.mode!=='draw');
    if(ed.mode==='draw'&&!ed.vb){ const sv=box.querySelector('svg'); ed.vb=sv.getAttribute('viewBox').split(' ').map(Number); }
  };
  const toCm=e=>{ const sv=box.querySelector('svg'),p=sv.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(sv.getScreenCTM().inverse()); return [q.x,q.y]; };
  const unit=()=>{ const sv=box.querySelector('svg'); const v=sv.viewBox.baseVal; return Math.max(v.width,v.height)/sv.getBoundingClientRect().width; };
  const snapPoint=p=>{ const g=geom(r),pr=roomPrims(r),th=28*unit(); let best=null,bd=th;
    const c=[...g.pts,...pr.ops.flatMap(o=>[o.p1,o.p2]),...g.cols.flat()]; c.forEach(q=>{const d=Math.hypot(q[0]-p[0],q[1]-p[1]); if(d<bd){bd=d;best=q;}}); if(best) return [...best];
    g.segs.forEach(sg=>{ const dx=sg.b[0]-sg.a[0],dy=sg.b[1]-sg.a[1],L2=dx*dx+dy*dy; if(!L2) return; let t=((p[0]-sg.a[0])*dx+(p[1]-sg.a[1])*dy)/L2; t=Math.max(0,Math.min(1,t)); const q=[sg.a[0]+dx*t,sg.a[1]+dy*t],d=Math.hypot(q[0]-p[0],q[1]-p[1]); if(d<bd){bd=d;best=q;} });

  const offAt=(wi,pt,ow)=>{ // отступ проёма от начала стены по точке касания (шаг 5 см)

      const d=Math.hypot(sg.a[0]+dx*t-pt[0],sg.a[1]+dy*t-pt[1]); if(d<bd){bd=d;best=sg.from+t*sg.len;} });

function tabWishes(){
  const o=state.obj;
  if(!o.rooms.length){ $('#tab').innerHTML='<div class="card"><h2>Вид чистовой отделки</h2><p style="color:var(--mut)">Сначала добавьте помещения на вкладке «Помещения».</p></div>'; return; }
  const sum=r=>{ const f=r.fin||{}; const parts=Object.entries(FIN).map(([k,d])=>{const t=finText(r,k);return t?`<span>${d.t}: <b>${esc(t)}</b></span>`:`<span class="warn">${d.t}: не выбрано</span>`;}); if(accText(r)) parts.push(`<span style="color:${ACC_COL}">Акцентная стена: <b>${esc(accText(r))}</b></span>`); if(quietText(r)) parts.push(`<span style="color:${QUIET_COL}">Тихие стены: <b>${esc(quietText(r))}</b></span>`); if(isWet(r)) parts.push(`<span>Точки водоснабжения: <b>${r.water||0}</b></span>`); return parts.join('<br>'); };
  $('#tab').innerHTML=`<div class="card"><h2>Вид чистовой отделки</h2><p style="color:var(--mut);margin:0">Нажмите на комнату и выберите отделку. Каждая комната заполняется отдельно. Цвет и артикул выбираются позже с дизайнером.</p></div>
   ${o.rooms.map(r=>{ const open=finOpen===r.id, f=r.fin||{}; return `<div class="card fin">
     <div class="row finhead" data-fo="${r.id}"><div style="flex:1"><h2 style="margin:0 0 4px">${esc(r.name)} <small style="color:var(--mut);font-weight:400">${f2(geom(r).area)} м²</small></h2><div class="finsum">${sum(r)}</div></div><span class="btn sec sm">${open?'Свернуть ▲':'Выбрать ▼'}</span></div>
     ${open?Object.entries(FIN).map(([k,d])=>`<h3>${d.t}</h3><div class="chips">${Object.keys(d.opts).map(t=>`<span class="chip ${(f[k]||{})[t]!==undefined?'on':''}" data-fk="${k}" data-fv="${t}">${t}</span>`).join('')}</div>
       ${Object.entries(f[k]||{}).filter(([t])=>d.opts[t]&&d.opts[t].length).map(([t,v])=>`<div class="subv"><small>${t}:</small> ${d.opts[t].map(x=>`<span class="chip sm ${v===x?'on':''}" data-fk="${k}" data-fv="${t}" data-fx="${x}">${x}</span>`).join('')}</div>`).join('')}`).join('')
      +extraWalls(r)
      +(isWet(r)?`<h3>Точки водоснабжения</h3><div class="row cnt"><button class="btn sec" data-wt="-1">−</button><b>${r.water||0}</b><button class="btn sec" data-wt="1">+</button><small style="color:var(--mut)">ХВС, ГВС</small></div>`:'')
      +`<label>Примечание по отделке комнаты</label><textarea data-fn placeholder="Например: фартук на кухне, тёплый пол, короб под трубы">${esc(r.finNote||'')}</textarea>`:''}
   </div>`}).join('')}
   <div class="card"><label>Общие примечания для сметы</label><textarea id="wn2" placeholder="Например: перенос мокрой зоны, демонтаж перегородки, вывоз мусора">${esc(o.notes2||'')}</textarea></div>`;
  const cur=()=>o.rooms.find(r=>r.id===finOpen);
  document.querySelectorAll('[data-fo]').forEach(el=>el.onclick=()=>{ finOpen=finOpen===el.dataset.fo?null:el.dataset.fo; tabWishes(); const c=document.querySelector(`[data-fo="${finOpen}"]`); c&&c.scrollIntoView({block:'start'}); });
  document.querySelectorAll('[data-fk]').forEach(el=>el.onclick=()=>{ const r=cur(),k=el.dataset.fk,t=el.dataset.fv,x=el.dataset.fx; r.fin=r.fin||{}; const m=r.fin[k]=r.fin[k]||{};
    if(x!==undefined) m[t]=x; else if(m[t]!==undefined) delete m[t]; else m[t]=FIN[k].opts[t][0]||'';
    save(); tabWishes(); });
  document.querySelectorAll('[data-xa]').forEach(el=>el.onclick=()=>{ const r=cur(),a=el.dataset.xa,v=el.dataset.v;
    if(a==='acc') r.accent=r.accent?null:{walls:[],type:'',v:''};
    if(a==='quiet') r.quiet=r.quiet?null:{walls:[],v:QUIET_V[0]};
    if(a==='aw'){ const w=r.accent.walls,i=w.indexOf(v); i>=0?w.splice(i,1):w.push(v); w.sort((x,y)=>x-y); }
    if(a==='at'){ if(r.accent.type===v){r.accent.type='';r.accent.v='';} else {r.accent.type=v;r.accent.v=FIN.walls.opts[v][0]||'';} }
    if(a==='av') r.accent.v=v;
    if(a==='qw'){ const w=r.quiet.walls,i=w.indexOf(v); i>=0?w.splice(i,1):w.push(v); w.sort((x,y)=>x-y); }
    if(a==='qa') r.quiet.walls=[];
    if(a==='qv') r.quiet.v=v;
    save(); tabWishes(); });
  document.querySelectorAll('[data-wt]').forEach(el=>el.onclick=()=>{ const r=cur(); r.water=Math.max(0,(r.water||0)+ +el.dataset.wt); save(); tabWishes(); });
  const fn=document.querySelector('[data-fn]'); if(fn) fn.oninput=e=>{cur().finNote=e.target.value;save();};
  $('#wn2').oninput=e=>{o.notes2=e.target.value;save();};
}
function extraWalls(r){
  const W=r.walls.map((w,i)=>String(i+1)), wl=i=>`${i} <small>(${LET[i-1]||''}–${LET[i%r.walls.length]||''}) ${f2(num(r.walls[i-1].len)/100)} м</small>`;
  const a=r.accent,q=r.quiet;
  let h=`<h3>Дополнительно (по желанию)</h3><div class="chips"><span class="chip ${a?'on':''}" data-xa="acc">${a?'':'+ '}Акцентная стена</span><span class="chip ${q?'on':''}" data-xa="quiet">${q?'':'+ '}Тихие стены (шумоизоляция)</span></div>`;
  if(!a&&!q) return h;
  h+=`<div class="xw"><div class="xplan">${r.walls.length?planSVG(r,{h:300,wallNums:true,small:true}):'<p style="color:var(--mut)">Нет стен — сначала замер помещения.</p>'}</div><div>`;
  if(a) h+=`<div class="xbox" style="border-color:${ACC_COL}"><b style="color:${ACC_COL}">Акцентная стена</b><div class="subv"><small>Какая стена:</small> ${W.map(i=>`<span class="chip sm ${a.walls.includes(i)?'on':''}" data-xa="aw" data-v="${i}">${wl(i)}</span>`).join('')}</div>
    <div class="subv"><small>Отделка:</small> ${Object.keys(FIN.walls.opts).map(t=>`<span class="chip sm ${a.type===t?'on':''}" data-xa="at" data-v="${t}">${t}</span>`).join('')}</div>
    ${a.type&&FIN.walls.opts[a.type].length?`<div class="subv"><small>${a.type}:</small> ${FIN.walls.opts[a.type].map(x=>`<span class="chip sm ${a.v===x?'on':''}" data-xa="av" data-v="${x}">${x}</span>`).join('')}</div>`:''}
    ${a.walls.length?`<div style="margin-top:6px">Площадь: <b>${f2(a.walls.reduce((s,w)=>s+wallArea(r,w),0))} м²</b> <small style="color:var(--mut)">(без проёмов)</small></div>`:'<div class="warn" style="margin-top:6px">Выберите стену</div>'}</div>`;
  if(q) h+=`<div class="xbox" style="border-color:${QUIET_COL}"><b style="color:${QUIET_COL}">Тихие стены</b><div class="subv"><small>Система:</small> ${QUIET_V.map(x=>`<span class="chip sm ${q.v===x?'on':''}" data-xa="qv" data-v="${x}">${x}</span>`).join('')}</div>
    <div class="subv"><small>Стены:</small> <span class="chip sm ${q.walls.length?'':'on'}" data-xa="qa">все</span>${W.map(i=>`<span class="chip sm ${q.walls.includes(i)?'on':''}" data-xa="qw" data-v="${i}">${wl(i)}</span>`).join('')}</div>
    <div style="margin-top:6px">Площадь: <b>${esc(quietText(r).split(' · ').pop())}</b> <small style="color:var(--mut)">(без проёмов)</small></div></div>`;
  return h+`</div></div>`;
}
function finTable(o){
  return `<table><tr><th>Помещение</th><th>Пол</th><th>Стены</th><th>Потолок</th><th class="n">Точки водоснабжения</th></tr>${o.rooms.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(finText(r,'floor'))}</td><td>${esc(finText(r,'walls'))}${accText(r)?`<br><span style="color:${ACC_COL}">Акцент: ${esc(accText(r))}</span>`:''}${quietText(r)?`<br><span style="color:${QUIET_COL}">Тихие стены: ${esc(quietText(r))}</span>`:''}</td><td>${esc(finText(r,'ceil'))}</td><td class="n">${isWet(r)?(r.water||0):''}</td></tr>${r.finNote?`<tr><td></td><td colspan="4"><i>${esc(r.finNote)}</i></td></tr>`:''}`).join('')}</table>`;
}

// ---------- фото ----------
function compress(file,m=1280){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{ k=Math.min(1,m/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=img.width*k;c.height=img.height*k; c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.75)); URL.revokeObjectURL(img.src); }; img.src=URL.createObjectURL(file); }); }
async function photoBlock(box,input,owner,label){
  const o=state.obj; const draw=async()=>{ const ph=(await DB.all('photos')).filter(p=>p.obj===o.id&&(owner?p.owner===owner:true));
    $(box).innerHTML=ph.map(p=>`<figure><img src="${p.data}"><figcaption>${esc(p.label)}</figcaption><button class="x" data-dp="${p.id}">×</button></figure>`).join('')||'<p style="color:var(--mut)">Фото пока нет.</p>';
    document.querySelectorAll(`${box} [data-dp]`).forEach(el=>el.onclick=async()=>{await DB.del('photos',el.dataset.dp);draw();}); };
  if(input) $(input).onchange=async e=>{ for(const f of e.target.files){ await DB.put('photos',{id:uid(),obj:o.id,owner:owner||'obj',label:label||'Общее',data:await compress(f),t:Date.now()}); } e.target.value=''; draw(); };
  draw();
}
function tabPhotos(){
  $('#tab').innerHTML=`<div class="card"><h2>Все фото объекта</h2><div class="photos" id="aph"></div><label class="btn sec" style="margin-top:10px">${ic('photo')} Общее фото<input type="file" accept="image/*" capture="environment" id="acam" class="hidden"></label></div>`;
  photoBlock('#aph','#acam',null,'Общее');
}

// ---------- итоги ----------
function totals(o){ const t={area:0,walls:0,perim:0,plinth:0,slopes:0}; o.rooms.forEach(r=>{const g=geom(r);t.area+=g.area;t.walls+=g.walls;t.perim+=g.perim;t.plinth+=g.plinth;t.slopes+=g.slopes;}); return t; }
function volumesTable(o){
  return `<table><tr><th>Помещение</th><th class="n">Пол, м²</th><th class="n">Стены, м²</th><th class="n">Периметр, м</th><th class="n">Плинтус, м</th><th class="n">Откосы, м</th><th class="n">Высота, м</th></tr>
  ${o.rooms.map(r=>{const g=geom(r);return`<tr><td>${esc(r.name)}</td><td class="n">${f2(g.area)}</td><td class="n">${f2(g.walls)}</td><td class="n">${f2(g.perim)}</td><td class="n">${f2(g.plinth)}</td><td class="n">${f2(g.slopes)}</td><td class="n">${f2(g.H)}</td></tr>`}).join('')}
  ${(()=>{const t=totals(o);return`<tr><th>Итого</th><th class="n">${f2(t.area)}</th><th class="n">${f2(t.walls)}</th><th class="n">${f2(t.perim)}</th><th class="n">${f2(t.plinth)}</th><th class="n">${f2(t.slopes)}</th><th></th></tr>`})()}</table>`;
}
function tabTotal(){
  const o=state.obj, t=totals(o);
  $('#tab').innerHTML=`<div class="card"><h2>Итоги замера</h2><div class="stat"><div><b>${f2(t.area)} м²</b><span>Площадь пола</span></div><div><b>${f2(t.walls)} м²</b><span>Стены без проёмов</span></div><div><b>${f2(t.plinth)} м</b><span>Плинтус</span></div><div><b>${f2(t.slopes)} м</b><span>Откосы</span></div></div></div>
  <div class="card">${volumesTable(o)}</div>
  <div class="card"><h2>Вид чистовой отделки</h2>${finTable(o)}</div>
  <div class="card row"><button class="btn" id="pp">${ic('doc')} Паспорт замера (PDF)</button><button class="btn sec" id="csv">${ic('down')} Объёмы для сметы (Excel)</button><button class="btn sec" id="js">${ic('down')} Файл замера для офиса</button></div>`;
  $('#pp').onclick=()=>passport(o);
  $('#csv').onclick=()=>{ const rows=[['Помещение','Пол м2','Стены м2','Периметр м','Плинтус м','Откосы м','Высота м','Пол','Стены','Акцентная стена','Тихие стены','Потолок','Точки водоснабжения']]; o.rooms.forEach(r=>{const g=geom(r);rows.push([r.name,g.area,g.walls,g.perim,g.plinth,g.slopes,g.H].map(v=>typeof v==='number'?String(Math.round(v*100)/100).replace('.',','):v).concat([finText(r,'floor'),finText(r,'walls'),accText(r),quietText(r),finText(r,'ceil'),isWet(r)?String(r.water||0):''].map(v=>'"'+v.replace(/"/g,'""')+'"')));});
    download(new Blob(['﻿'+rows.map(r=>r.join(';')).join('\n')],{type:'text/csv'}),`объёмы-${(o.client||'замер').replace(/\s+/g,'_')}.csv`); };
  $('#js').onclick=async()=>{ const ph=(await DB.all('photos')).filter(p=>p.obj===o.id); download(new Blob([JSON.stringify({app:'zamer-ks',v:1,objects:[o],photos:ph})],{type:'application/json'}),`замер-${(o.client||'объект').replace(/\s+/g,'_')}.json`); };
}

// ---------- паспорт (печать в PDF) ----------
async function passport(o){
  const ph=(await DB.all('photos')).filter(p=>p.obj===o.id).slice(0,12);
  $('#passport').innerHTML=`
   <div class="pg"><h1 style="margin:0">Паспорт замера квартиры</h1><p style="margin:4px 0 12px;color:#555">Капиталстрой · ремонт квартир · kapitalstroy68.com</p>
   <table><tr><td>Клиент</td><td>${esc(o.client)} ${esc(o.phone)}</td></tr><tr><td>Адрес</td><td>${esc(o.address)} ${o.jk?'· '+esc(o.jk):''}</td></tr>${o.flatType?`<tr><td>Тип помещения</td><td>${esc(o.flatType)}</td></tr>`:''}<tr><td>Дата замера</td><td>${new Date(o.created).toLocaleDateString('ru-RU')}</td></tr><tr><td>Менеджер</td><td>${esc(o.manager)}</td></tr></table></div>
   <div class="pg"><h2>План квартиры</h2>${aptSVG(o,{h:420})}</div>
   <div class="pg"><h2>Объёмы</h2>${volumesTable(o)}</div>
   ${o.rooms.map(r=>`<div class="pg"><h2>${esc(r.name)}</h2>${planSVG(r,{h:380})}${isWet(r)?`<div><b>Точки водоснабжения:</b> ${r.water||0}</div>`:''}${Object.entries(r.state||{}).filter(([k,v])=>v.length&&STATE_OPTS[k]).map(([k,v])=>`<div><b>${esc(k)}:</b> ${esc(v.join(', '))}</div>`).join('')}${r.note?`<div><b>Примечание:</b> ${esc(r.note)}</div>`:''}</div>`).join('')}
   <div class="pg"><h2>Вид чистовой отделки</h2>${finTable(o)}${o.notes2?`<p><b>Примечания для сметы:</b> ${esc(o.notes2)}</p>`:''}</div>
   ${ph.length?`<div class="pg"><h2>Фото</h2><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${ph.map(p=>`<img src="${p.data}" style="width:100%;height:150px;object-fit:cover">`).join('')}</div></div>`:''}`;
  setTimeout(()=>{ if(window.ZKS&&ZKS.print) ZKS.print('Паспорт замера '+(o.client||'')); else window.print(); },300);
}

DB.open().then(render).catch(e=>{$('#app').innerHTML='<div class="card warn">Браузер не дал сохранить данные: '+esc(e)+'</div>';});
</script>
</body>
</html>
