/* Фирменный стиль КапиталСтрой: графит + сигнальный красный, чертёжная сетка.
   Раскладка: тёмная шапка с логотипом → липкая лента вкладок → карточки на светлом «бетонном» фоне. */
:root{
 --graphite:#1E2227;--graphite2:#2B3037;--graphite3:#3A414A;
 --red:#D3232B;--red2:#B01B22;--redsoft:#FCE9EA;
 --bg:#EEF0F2;--card:#FFFFFF;--ink:#1E2227;--mut:#69717C;--line:#DDE1E6;--line2:#EEF1F4;
 --acc:var(--red);--acc2:var(--graphite);--ok:#1E8A4C;--oksoft:#E5F4EA;--warn:#C2410C;--warnsoft:#FFF1E8;
 --blue:#2F6FDB;
 --display:'Oswald','Arial Narrow','Roboto Condensed',sans-serif;
 --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 --r:16px;--hh:64px;
 color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font:16px/1.45 var(--body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--graphite)}
::selection{background:var(--red);color:#fff}
:focus-visible{outline:3px solid color-mix(in srgb,var(--red) 55%,transparent);outline-offset:2px}

/* шапка */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--hh);background:var(--graphite);color:#fff;display:flex;align-items:center;gap:14px;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
 background-image:linear-gradient(90deg,transparent 0 calc(100% - 1px),#ffffff08 0),linear-gradient(0deg,transparent 0 calc(100% - 1px),#ffffff08 0);background-size:24px 24px}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--red) 0 120px,transparent 120px)}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;flex:none}
.brand .mk{height:40px;width:auto;flex:none}
.brand .wm{font:700 21px/1 var(--body);letter-spacing:-.01em;white-space:nowrap}
.brand .wm b{color:inherit;font-weight:700}
.brand .sub{display:block;font:500 12px/1 var(--body);letter-spacing:.02em;color:#ffffffa6;margin-top:4px}
header h1{font:600 18px/1.1 var(--body);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:14px;border-left:1px solid #ffffff26}
header h1:empty{border:0}
header button{display:inline-flex;align-items:center;gap:6px;background:#ffffff10;color:#fff;border:1px solid #ffffff2e;border-radius:12px;min-height:42px;padding:0 14px;font:600 15px var(--body);cursor:pointer}
header button:active{background:#ffffff22}
header #hdrAction{background:transparent}
@media (max-width:640px){.brand .wm,.brand .sub{display:none}}

main{max-width:1240px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* типографика */
h2{font:600 17px/1.2 var(--display);letter-spacing:.07em;text-transform:uppercase;margin:0 0 14px;display:flex;align-items:center;gap:10px;text-wrap:balance}
h2::before{content:"";width:14px;height:10px;flex:none;border-left:2px solid var(--red);border-right:2px solid var(--red);background:linear-gradient(var(--red),var(--red)) center/100% 2px no-repeat}
h2 small{font-family:var(--body);text-transform:none;letter-spacing:0}
h3{font:700 12px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;margin:18px 0 10px;color:var(--mut)}
label{display:block;font:600 12px/1.2 var(--body);letter-spacing:.04em;color:var(--mut);margin:10px 0 6px}
small{font-size:.82em}

/* поверхности */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:14px}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

/* поля */
input,select,textarea{width:100%;font:500 17px var(--body);min-height:50px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--graphite);box-shadow:0 0 0 4px #1e22271a}
input[type=number]{font-variant-numeric:tabular-nums}
input::placeholder,textarea::placeholder{color:#9AA1AB}
textarea{min-height:92px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;min-height:50px;padding:0 20px;font:700 16px var(--body);background:var(--red);color:#fff;cursor:pointer;transition:transform .08s,background .15s;box-shadow:0 1px 0 #00000014,0 6px 16px -8px color-mix(in srgb,var(--red) 70%,transparent)}
.btn:active{transform:scale(.97)}
.btn:hover{background:var(--red2)}
.btn.sec{background:var(--line2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.sec:hover{background:#E4E8EC}
.btn.blue{background:var(--graphite);box-shadow:0 6px 16px -8px #1e2227aa}
.btn.blue:hover{background:var(--graphite3)}
.btn.sm{min-height:42px;padding:0 14px;font-size:14px;border-radius:11px}
.btn.ghost{background:transparent;color:var(--red);box-shadow:none;padding:0 8px}
.btn:disabled{opacity:.4;pointer-events:none}
.btn svg,.chip svg{width:19px;height:19px;flex:none}
.x{border:0;background:var(--redsoft);color:var(--red2);border-radius:10px;min-height:50px;font-size:20px;cursor:pointer}

/* чипы */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:46px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:0 15px;font:600 15px var(--body);color:var(--ink);cursor:pointer;user-select:none;transition:background .12s,border-color .12s,transform .08s}
.chip:active{transform:scale(.96)}
.chip:hover{border-color:#C5CBD3}
.chip.on{background:var(--graphite);color:#fff;border-color:var(--graphite)}
.chip.on::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--red);flex:none}
.chip.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.chip.sm.on::before{width:6px;height:6px}
.subv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0 6px;padding:2px 0 2px 14px;border-left:2px dashed #C9CFD6}

.tabs::-webkit-scrollbar{display:none}

.tabs .chip.on::before{display:none}

 background-image:linear-gradient(90deg,transparent 0 calc(100% - 1px),#ffffff0d 0),linear-gradient(0deg,transparent 0 calc(100% - 1px),#ffffff0d 0);background-size:32px 32px}

const DB = {
  db: null,

const wlen=w=>num(w.len)||w.d;

  let ex=0,ey=0; L.forEach((l,i)=>{ ex+=l*U[i][0]; ey+=l*U[i][1]; });
  let a=0,b=0,c=0; F.forEach(i=>{ const wt=Math.max(20,W[i].d); a+=wt*U[i][0]*U[i][0]; b+=wt*U[i][0]*U[i][1]; c+=wt*U[i][1]*U[i][1]; });

  else { if(tr<1e-9) return L; const vx=Math.sqrt(a/tr), vy=(b>=0?1:-1)*Math.sqrt(c/tr), k=-(vx*ex+vy*ey)/tr; lx=k*vx; ly=k*vy; }

    if(!opt.only||opt.label){ const c=centroid(P);
      if(tight){ top+=`<text x="${c[0]}" y="${c[1]+(bh>80?fs*1.9:fs*.35)}" text-anchor="middle" font-size="${fs.toFixed(1)}" font-weight="800" fill="#1E2227" ${halo} pointer-events="none">${esc(r.name)} <tspan font-weight="600" fill="${g.done?'#1E8A4C':'#69717C'}">${g.done?f2(g.area)+' м²':'≈'+f2(g.area)}</tspan></text>`; return; }
      top+=`<text x="${c[0]}" y="${c[1]-fs*.2}" text-anchor="middle" font-size="${(fs*1.15).toFixed(1)}" font-weight="800" fill="#1E2227" ${halo} pointer-events="none">${esc(r.name)}</text>`;
      top+=`<text x="${c[0]}" y="${c[1]+fs*1.1}" text-anchor="middle" font-size="${fs.toFixed(1)}" font-weight="600" fill="${g.done?'#1E8A4C':'#69717C'}" ${halo} pointer-events="none">${g.done?f2(g.area)+' м²':`≈${f2(g.area)} м² · измерено ${g.sized}/${g.n}`}</text>`;
      if(mv) top+=`<text x="${c[0]}" y="${c[1]+fs*2.4}" text-anchor="middle" font-size="${fs.toFixed(1)}" font-weight="800" fill="#2F6FDB" ${halo} pointer-events="none">тяните пальцем</text>`;
      else if(g.done&&g.gap>5) top+=`<text x="${c[0]}" y="${c[1]+fs*2.3}" text-anchor="middle" font-size="${fs.toFixed(1)}" font-weight="700" fill="#D3232B" ${halo} pointer-events="none">не сходится на ${cm(g.gap)} см</text>`; }
  });
  // стены: наружные толстые, общие с соседней комнатой — тонкая перегородка
  // стены: синие со штриховкой; несущие толще. Наружная стена уходит наружу от комнаты, общая — по оси между комнатами
  let wOut='', wIn='', seen=new Set();
  wallSegs(rooms).forEach(sg=>{ const key=sg.p.concat(sg.q).map(v=>Math.round(v)).join(','), key2=sg.q.concat(sg.p).map(v=>Math.round(v)).join(',');
    if(sg.inner&&seen.has(key2)) return; seen.add(key);
    const T=Math.max(WT(sg.bear),(sg.bear?9:6)*k), u=unit(sg.p,sg.q), n=sg.n, a=sg.inner?-T/2:0, b=sg.inner?T/2:T, ex=sg.inner?0:T;
    const p=[sg.p[0]-u[0]*ex,sg.p[1]-u[1]*ex], q=[sg.q[0]+u[0]*ex,sg.q[1]+u[1]*ex];
    const Q=[[p[0]+n[0]*a,p[1]+n[1]*a],[q[0]+n[0]*a,q[1]+n[1]*a],[q[0]+n[0]*b,q[1]+n[1]*b],[p[0]+n[0]*b,p[1]+n[1]*b]].map(v=>v.map(x=>x.toFixed(1)).join(',')).join(' ');
    wOut+=`<polygon points="${Q}" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="${(2.2*k).toFixed(1)}" stroke-linejoin="miter"/>`;
    wIn+=`<polygon points="${Q}" fill="url(#ht)"/>`; });
  const walls=wOut+wIn;
  let ris='';
  (o.risers||[]).forEach((q,i)=>{ if(opt.only&&risRoom(o,q)?.id!==opt.only) return; const T=RIS[q.t], rr=Math.max(11,10*k), on=opt.dragRis===i;
    ris+=`<g ${opt.static?'':`data-ris="${i}" style="cursor:grab"`}><circle cx="${q.x}" cy="${q.y}" r="${(rr*(on?1.25:1)).toFixed(1)}" fill="${T.c}" stroke="#fff" stroke-width="${(2.5*k).toFixed(1)}"/><text x="${q.x}" y="${(q.y+rr*.38).toFixed(1)}" text-anchor="middle" font-size="${(rr*1.05).toFixed(1)}" font-weight="800" fill="#fff" pointer-events="none">${T.s}</text></g>`; });
  s+=fills+walls+opsS+hits+top+ops+ris+hnd;
  if(opt.draw&&opt.draw.length){ const C=opt.draw;
    s+=`<polyline points="${C.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#D3232B" stroke-width="${(3.5*k).toFixed(1)}" stroke-linejoin="round"/>`;
    C.forEach((p,i)=>{ s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${(i?5:9)*k}" fill="${i?'#D3232B':'#1E8A4C'}" stroke="#fff" stroke-width="${2*k}"/>`; }); }
  s+=`<g id="pv"></g></svg>`;
  return s;
}

function svgPt(svg,e){ const m=svg.getScreenCTM().inverse(); const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m); return [p.x,p.y]; }

function nearCorner(p,thr,except){ let best=null,bd=thr; for(const q of allCorners(except)){ const d=Math.hypot(q[0]-p[0],q[1]-p[1]); if(d<bd){bd=d;best=q;} } return best; }
// 'near' — точка легла рядом с началом контура: спрашиваем, замкнуть ли комнату

  if(!force&&C.length>=3&&Math.hypot(q[0]-C[0][0],q[1]-C[0][1])<R) return 'near';

}

}

// окна и двери тянутся пальцем: вдоль стены и на любую другую стену своей комнаты
function nearestWall(r,p){ const S=sides(pts(r)); let best=null;
  S.forEach((s,i)=>{ const dx=s.q[0]-s.p[0],dy=s.q[1]-s.p[1],L=s.L||1; const t=Math.max(0,Math.min(1,((p[0]-s.p[0])*dx+(p[1]-s.p[1])*dy)/(L*L)));
    const d=Math.hypot(s.p[0]+dx*t-p[0],s.p[1]+dy*t-p[1]); if(!best||d<best.d) best={i,t,L,d}; }); return best; }

    e.preventDefault(); e.stopPropagation(); const [rid,i]=t.dataset.op.split(':'); const r=state.obj.rooms.find(x=>x.id===rid); if(!r) return;
    od={r,key:t.dataset.op,op:r.openings[+i],x:e.clientX,y:e.clientY,moved:false}; try{ box.setPointerCapture(e.pointerId); }catch(_){} },true);

    const p=svgPt(box.querySelector('svg'),e), w=nearestWall(od.r,p); if(!w) return; const op=od.op, wd=Math.min(num(op.w)||80,w.L);

    redraw(od.key); const h=$('#hint'); if(h&&box.id==='planBox') h.textContent=`${op.type}: стена ${op.wall}, ${op.off} см от угла. Отпустите, чтобы поставить.`; },true);
  const end=async e=>{ if(!od) return; const d=od; od=null; ed.skip=true; setTimeout(()=>ed.skip=false,350);
    if(d.moved){ await save(true); toast(`${d.op.type}: стена ${d.op.wall}, ${d.op.off} см от угла`); } else toast('Окно или дверь можно тянуть пальцем');

  document.body.appendChild(d); const cv=d.querySelector('canvas'), ctx=cv.getContext('2d');
  const all=rooms.flatMap(r=>pts(r)); const cx=(Math.min(...all.map(p=>p[0]))+Math.max(...all.map(p=>p[0])))/2, cy=(Math.min(...all.map(p=>p[1]))+Math.max(...all.map(p=>p[1])))/2;

  const walls=[]; rooms.forEach(r=>{ const P=pts(r), S=sides(P), ccw=sarea(P)<0, acc=r.fin.accent==='да'?r.fin.accWall.map(Number):[];

    });

    (o.risers||[]).forEach(q=>{ const A=P3(q.x,q.y,0), B=P3(q.x,q.y,Hc); ctx.lineCap='round'; ctx.strokeStyle='#ffffff'; ctx.lineWidth=11; ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.stroke();
      ctx.strokeStyle=RIS[q.t].c; ctx.lineWidth=7; ctx.stroke(); ctx.lineCap='butt'; });

  }
  const pts0=new Map(); let last=null, pinch=null;

  cv.onpointermove=e=>{ if(!pts0.has(e.pointerId)) return; const prev=pts0.get(e.pointerId); pts0.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts0.size===2){ const [p1,p2]=[...pts0.values()]; const dd=Math.hypot(p1[0]-p2[0],p1[1]-p2[1]); if(pinch) zoom=Math.max(.4,Math.min(5,zoom*dd/pinch)); pinch=dd; draw(); return; }

  d.querySelector('[data-v="top"]').onclick=()=>{ yaw=0; pitch=1.5; zoom=1; draw(); };
  d.querySelector('[data-v="iso"]').onclick=()=>{ yaw=-.6; pitch=.75; zoom=1; draw(); };
  const close=()=>{ window.removeEventListener('resize',fit); d.remove(); };
  d.querySelector('#v3x').onclick=close; d.close=close;
  window.addEventListener('resize',fit); requestAnimationFrame(fit);
}

// ---------- живой план: стыковка стен, правка пальцем, подсказки ----------

  S.forEach((A,ai)=>A.E.forEach((e,i)=>{ const u=unit(e.p,e.q), L=e.L, iv=[], bA=A.r.walls[i].bear;
    S.forEach((B,bi)=>{ if(bi===ai) return; B.E.forEach((f,fi)=>{ const v=unit(f.p,f.q); if(Math.abs(crs(u,v))>0.03) return;

    if(c<L-1) out.push({p:at(c),q:at(L),inner:false,bear:bA!==false,n,rid:A.r.id,i}); })); return out; }

const WT=b=>b?24:14;
// Записать новый контур комнаты; размеры по рулетке, которые палец изменил, становятся неизмеренными

function orthoRoom(r){ r.walls.forEach(w=>{ const d=angDev(w.a); if(d<15) w.a=Math.round(w.a/90)*90%360; else { const d45=Math.abs(w.a-Math.round(w.a/45)*45); if(d45<8) w.a=Math.round(w.a/45)*45%360; } }); }

function dockVec(r,tol,min=0){ const PA=pts(r), A=sides(PA); let best=null;
  for(const B of state.obj.rooms){ if(B.id===r.id) continue; const PB=pts(B);
    for(const f of sides(PB)) for(const e of A){ const u=unit(e.p,e.q), v=unit(f.p,f.q); if(Math.abs(crs(u,v))>0.03) continue;

const KV_NAME=k=>k===0?'Студия':k+'-комн.';

// Собираем примерную планировку по площадям: окна в верхнем ряду (кухня и комнаты), снизу санузел и коридор.
function genLayout(kv,total,kitchen){
  const euro=kv>0&&kitchen>=15.5, bathA=kv>=3?[3.8,1.5]:[kv>=2?4.3:3.8], corrA=Math.max(3.5,total*(kv?0.12:0.1));
  if(!kitchen) kitchen=kv===0?0:kv===1?11:kv===2?12:13;
  const live=Math.max(9,total-kitchen-bathA.reduce((a,b)=>a+b,0)-corrA);
  const split=kv===0?[1]:kv===1?[1]:kv===2?[.55,.45]:kv===3?[.4,.32,.28]:[.32,.24,.22,.22];
  const names=kv===0?['Кухня-гостиная']:kv===1?[euro?'Кухня-гостиная':'Гостиная']:['Гостиная','Спальня','Детская','Кабинет'].slice(0,kv);
  const row=[]; if(kv>0&&!(kv===1&&euro)) row.push({n:euro?'Кухня-гостиная':'Кухня',a:kitchen});
  split.forEach((f,i)=>row.push({n:names[i]||'Спальня',a:live*f+(kv===0||kv===1&&euro?kitchen:0)}));
  const D=kv===0?420:480, r5=v=>Math.max(60,Math.round(v/5)*5);
  let x=0; const top=row.map(q=>{ const w=r5(q.a*1e4/D); const R={n:q.n,x,y:0,w,h:D}; x+=w; return R; }), W=x;
  const wet=bathA.map((a,i)=>({n:bathA.length>1?(i?'Туалет':'Ванная'):'Санузел',a}));
  // нижний ряд: санузел и коридор; если площади мало на всю ширину, коридор короче верхнего ряда
  const botA=Math.max(corrA,total*1e4-top.reduce((s,R)=>s+R.w*R.h,0))/1e4||corrA;
  const d2=r5(Math.min(240,Math.max(150,botA*1e4/W)));
  let bx=0; const bot=wet.map(q=>{ const w=r5(Math.max(q.n==='Туалет'?90:150,q.a*1e4/d2)); const R={n:q.n,x:bx,y:D,w,h:d2}; bx+=w; return R; });
  const cw=r5(Math.min(W-bx,Math.max(140,botA*1e4/d2-bx))); bot.push({n:'Коридор',x:bx,y:D,w:cw,h:d2});
  return {rooms:[...top,...bot],W,H:D+d2};
}
function rectRoom(o,R,x0,y0){ const r=newRoom(o,[[x0+R.x,y0+R.y],[x0+R.x+R.w,y0+R.y],[x0+R.x+R.w,y0+R.y+R.h],[x0+R.x,y0+R.y+R.h]],R.n); r.tpl=1; return r; }
function placeLayout(o,L,x0,y0){
  const made=L.rooms.map(R=>rectRoom(o,R,x0,y0)); const by=n=>made.filter(r=>r.name===n);
  made.forEach(r=>{ if(/Кухня|Гостиная|Спальня|Детская|Кабинет/.test(r.name)) r.openings.push({type:'Окно',wall:'1',w:String(r.walls[0].d>=300?150:120),h:'150',off:''});
    if(r.name!=='Коридор') r.openings.push({type:'Дверь',wall:'3',w:/Санузел|Ванная|Туалет/.test(r.name)?'70':'80',h:'200',off:''}); });
  const c=by('Коридор')[0]; if(c) c.openings.push({type:'Входная дверь',wall:'2',w:'90',h:'205',off:''});
  return made;
}
function tplBox(){ return new Promise(res=>{ const o=state.obj, d=document.createElement('div'); d.className='modal top';
  let tab='rooms', q='', kvF=o.kv==='Студия'?0:o.kv==='5+'?4:(parseInt(o.kv)||null);
  const shapeSVG=P=>{ const xs=P.map(p=>p[0]), ys=P.map(p=>p[1]), w=Math.max(...xs), h=Math.max(...ys), s=70/Math.max(w,h);
    return `<svg viewBox="-6 -6 ${w*s+12} ${h*s+12}" width="${w*s+12}" height="${h*s+12}"><polygon points="${P.map(p=>p[0]*s+','+p[1]*s).join(' ')}" fill="#FCE9EA" stroke="#1E2227" stroke-width="3"/></svg>`; };
  const layoutSVG=L=>{ const s=150/Math.max(L.W,L.H); return `<svg viewBox="-4 -4 ${L.W*s+8} ${L.H*s+8}" width="${L.W*s+8}" height="${L.H*s+8}">${L.rooms.map(R=>`<rect x="${R.x*s}" y="${R.y*s}" width="${R.w*s}" height="${R.h*s}" fill="${/Санузел|Ванная|Туалет/.test(R.n)?'#E8F0FC':R.n==='Коридор'?'#F3F4F6':'#fff'}" stroke="#1E2227" stroke-width="2"/>`).join('')}</svg>`; };
  const draw=()=>{ const list=DEVS.flatMap(z=>z.p.map(p=>({z,kv:p[0],t:p[1],k:p[2]||0}))).filter(x=>(kvF==null||x.kv===kvF||(kvF===4&&x.kv>=4))&&(!q||(x.z.zk+' '+x.z.dev+' '+x.z.adr).toLowerCase().includes(q.toLowerCase())));
    d.innerHTML=`<div class="box tplbox"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Шаблоны</h2><button class="btn sec sm" id="tx">${ic('close',18)}</button></div>
     <div class="chips" style="margin:12px 0"><span class="chip ${tab==='rooms'?'on':''}" data-tt="rooms">Готовые комнаты</span><span class="chip ${tab==='dev'?'on':''}" data-tt="dev">Планировки застройщиков</span></div>
     ${tab==='rooms'?`<p class="hint">Нажмите на форму, и комната встанет на план. Все размеры потом правятся нажатием на стену.</p><div class="tplgrid">${SHAPES.map((S,i)=>`<button class="tplc" data-sh="${i}">${shapeSVG(S.P)}<span>${S.n}</span></button>`).join('')}</div>`
     :`<p class="hint">Планировки собраны по площадям с сайтов застройщиков. Форма комнат примерная: после выбора пройдитесь рулеткой, размеры правятся нажатием на стену.</p>
      <input id="tq" placeholder="Поиск: ЖК, застройщик, улица" value="${esc(q)}" style="margin-bottom:8px">
      <div class="chips" style="margin-bottom:10px">${[[null,'Все'],[0,'Студии'],[1,'1-комн.'],[2,'2-комн.'],[3,'3-комн.'],[4,'4+']].map(([v,t])=>`<span class="chip sm ${kvF===v?'on':''}" data-kf="${v}">${t}</span>`).join('')}</div>
      <div class="tplgrid">${list.length?list.map((x,i)=>{ const L=genLayout(x.kv,x.t,x.k); return `<button class="tplc wide" data-ly="${i}">${layoutSVG(L)}<span><b>${KV_NAME(x.kv)} ${String(x.t).replace('.',',')} м²</b><br>${esc(x.z.zk)}<br><small>${esc(x.z.dev)}${x.k?`, кухня ${String(x.k).replace('.',',')} м²`:''}</small></span></button>`; }).join(''):'<p class="hint">Ничего не нашлось.</p>'}</div>`}</div>`;
    const end=v=>{ d.remove(); res(v); };
    d.querySelector('#tx').onclick=()=>end(null); d.onclick=e=>{ if(e.target===d) end(null); };
    d.querySelectorAll('[data-tt]').forEach(el=>el.onclick=()=>{ tab=el.dataset.tt; draw(); });
    d.querySelectorAll('[data-sh]').forEach(el=>el.onclick=()=>end({shape:SHAPES[+el.dataset.sh]}));
    d.querySelectorAll('[data-kf]').forEach(el=>el.onclick=()=>{ kvF=el.dataset.kf==='null'?null:+el.dataset.kf; draw(); });
    d.querySelectorAll('[data-ly]').forEach(el=>el.onclick=()=>end({lay:list[+el.dataset.ly]}));
    const tq=d.querySelector('#tq'); if(tq) tq.oninput=()=>{ q=tq.value; const pos=tq.selectionStart; draw(); const t2=d.querySelector('#tq'); t2.focus(); t2.setSelectionRange(pos,pos); }; };
  document.body.appendChild(d); draw(); }); }
async function useTemplate(){
  const o=state.obj, res=await tplBox(); if(!res) return;
  const all=o.rooms.flatMap(r=>pts(r)), x0=all.length?Math.max(...all.map(p=>p[0]))+80:0, y0=all.length?Math.min(...all.map(p=>p[1])):0;
  if(res.shape){ const S=res.shape, r=newRoom(o,S.P.map(p=>[x0+p[0],y0+p[1]]),S.name||undefined); r.tpl=1; o.rooms.push(r); ed.sel=r.id; ed.mode='size'; toast(`${S.n}: комната на плане. Нажмите на стену, чтобы поправить размер`); }
  else { const x=res.lay;
    if(o.rooms.length&&!await confirmBox('На плане уже есть комнаты. Заменить их типовой планировкой?','Заменить')) return;
    if(o.rooms.length){ for(const p of (await DB.all('photos')).filter(p=>p.obj===o.id)) await DB.del('photos',p.id); o.rooms=[]; o.risers=[]; }
    o.rooms.push(...placeLayout(o,genLayout(x.kv,x.t,x.k),0,0)); o.src=`${x.z.zk} (${x.z.dev}), ${KV_NAME(x.kv)} ${x.t} м²`;
    if(!o.kv) o.kv=x.kv===0?'Студия':x.kv>=5?'5+':String(x.kv); ed.sel=null; ed.mode='size'; toast('Планировка на плане. Проверьте размеры рулеткой'); }
  ed.vb=null; await save(true); renderPlan(); planStat(); drawTabs();
}

let rsz=null; window.addEventListener('resize',()=>{ clearTimeout(rsz); rsz=setTimeout(()=>{ if(state.view==='obj'&&state.tab==='plan'&&!ed.cur.length) renderPlan(); },200); });
